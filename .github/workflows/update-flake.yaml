name: Update Flake and Validate Build

on:
  schedule:
    - cron: "30 00 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  update-flake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      operation: ${{ steps.update.outputs.pull-request-operation }}
      pull-request-number: ${{ steps.update.outputs.pull-request-number }}
      pull-request-url: ${{ steps.update.outputs.pull-request-url }}

    steps:
      - name: Repository checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21

      - name: Update flake.lock
        id: update
        uses: DeterminateSystems/update-flake-lock@v28
        with:
          branch: deps/update-flake-lock
          commit-msg: "chore(deps): update flake.lock"
          pr-title: "chore(deps): update flake.lock"
          pr-body: |
            Automated flake input update created by the update-flake-lock action.

            The updated configuration is validated on Linux and macOS by this workflow.
          pr-labels: |
            dependencies
            automated

  validate-update:
    needs: update-flake
    if: >-
      needs.update-flake.outputs.operation == 'created' ||
      needs.update-flake.outputs.operation == 'updated'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Repository checkout
        uses: actions/checkout@v6
        with:
          ref: deps/update-flake-lock

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21

      - name: Validate configuration
        run: nix flake check --print-build-logs
